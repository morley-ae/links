<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a16">
  <title>Link clicks | morley.ae</title>
  <style>
    :root {
      --background: #080a16;
      --surface: rgba(20, 25, 48, .82);
      --surface-bright: rgba(38, 46, 79, .72);
      --text: #f5f7ff;
      --muted: #9da5c4;
      --cyan: #57e6ff;
      --violet: #a77bff;
      --line: rgba(255, 255, 255, .14);
    }

    * { box-sizing: border-box; }

    body { overflow-x: hidden; }

    body::before,
    body::after {
      position: fixed;
      width: 220px;
      height: 220px;
      border: 1px solid rgba(87, 230, 255, .12);
      border-radius: 50%;
      content: "";
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    body::before { top: 8%; left: -120px; }
    body::after { right: -120px; bottom: 8%; animation-delay: -5s; }

    body {
      min-height: 100svh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(32, 160, 209, .18), transparent 32%),
        radial-gradient(circle at 90% 100%, rgba(119, 55, 199, .2), transparent 36%),
        var(--background);
      font-family: "Avenir Next", Avenir, "Helvetica Neue", sans-serif;
    }

    main {
      display: none;
      width: min(100% - 32px, 680px);
      margin: 0 auto;
      padding: 54px 0 36px;
      animation: page-in .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .auth.is-hidden + main { display: block; }

    .auth {
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: 24px;
      animation: page-in .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .auth-card {
      width: min(100%, 390px);
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(145deg, var(--surface-bright), var(--surface));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }

    .auth-title { margin: 10px 0 8px; font: 400 32px/1.05 Georgia, "Times New Roman", serif; }
    .auth-copy { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .auth-form { display: grid; gap: 10px; }
    .auth-input {
      width: 100%;
      min-height: 46px;
      padding: 0 13px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: rgba(0, 0, 0, .2);
      font: inherit;
    }
    .auth-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(87, 230, 255, .12); }
    .auth-submit { min-height: 44px; border: 0; border-radius: 10px; color: #07111d; background: var(--cyan); font-weight: 800; cursor: pointer; }
    .auth-error { min-height: 18px; color: #ff8fba; font-size: 12px; }
    .is-hidden { display: none; }

    header { margin-bottom: 28px; }

    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 400;
      letter-spacing: -.04em;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .updated { color: var(--muted); font-size: 12px; }

    .refresh {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 13px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .08);
      font: 700 12px "Avenir Next", Avenir, sans-serif;
      cursor: pointer;
    }

    .refresh:hover { background: var(--surface-bright); }
    .refresh:disabled { cursor: wait; opacity: .65; }

    .refresh-icon {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .counts { display: grid; gap: 10px; }

    .count-card {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      min-height: 78px;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(135deg, var(--surface-bright), var(--surface));
      box-shadow: 0 10px 28px rgba(0, 0, 0, .2);
      animation: card-in .65s both;
    }

    .count-card:nth-child(2) { animation-delay: 80ms; }
    .count-card:nth-child(3) { animation-delay: 160ms; }
    .count-card:nth-child(4) { animation-delay: 240ms; }
    .count-card:nth-child(5) { animation-delay: 320ms; }
    .count-card:nth-child(6) { animation-delay: 400ms; }

    .count-card.is-loading { opacity: .65; }

    .count-label {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .count-icon {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      place-items: center;
      color: var(--cyan);
      border: 1px solid rgba(87, 230, 255, .28);
      border-radius: 10px;
      background: rgba(87, 230, 255, .09);
      font-size: 13px;
      font-weight: 800;
    }

    .count-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    .count-platform { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .count-value { color: var(--cyan); font-size: 27px; font-weight: 700; transition: transform .3s ease, color .3s ease; }
    .count-value.is-updated { animation: value-pop .45s ease both; }
    .count-error { color: #ff8fba; font-size: 12px; }

    footer { margin-top: 24px; color: var(--muted); font-size: 12px; }

    @keyframes page-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes card-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes value-pop { 50% { color: #fff; transform: scale(1.12); } }
    @keyframes drift { to { transform: translate(28px, -18px) rotate(18deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .refresh:not(:disabled) .refresh-icon { animation: spin 8s linear infinite; }

    @media (max-width: 420px) {
      main { width: min(100% - 24px, 680px); padding-top: 34px; }
      .count-card { padding-inline: 14px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <section class="auth" id="auth" aria-labelledby="auth-title">
    <div class="auth-card">
      <div class="eyebrow">morley.ae / private</div>
      <h1 class="auth-title" id="auth-title">Link clicks</h1>
      <p class="auth-copy">Enter the private password to view the current button statistics.</p>
      <form class="auth-form" id="auth-form">
        <input class="auth-input" id="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
        <button class="auth-submit" type="submit">Unlock dashboard</button>
        <div class="auth-error" id="auth-error" role="alert"></div>
      </form>
    </div>
  </section>
  <main>
    <header>
      <div class="eyebrow">morley.ae</div>
      <h1>Link clicks</h1>
      <p class="intro">Current numbers for every button.</p>
    </header>

    <div class="toolbar">
      <div class="updated" id="updated">Loading ...</div>
      <button class="refresh" id="refresh" type="button" aria-label="Refresh numbers">
        <svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-14.8-3L3 11m0 0V5m0 6h6M4 13a8.1 8.1 0 0 0 14.8 3L21 13m0 0v6m0-6h-6"/></svg>
        Refresh
      </button>
    </div>

    <section class="counts" id="counts" aria-live="polite"></section>
    <footer>Numbers are loaded directly from CounterAPI.</footer>
  </main>

  <script>
    const passwordHash = '02e486a47fb65a8afb4975dd441453ba656658715d2e7289e1ef3c1f52cea8e4';
    const auth = document.getElementById('auth');
    const authForm = document.getElementById('auth-form');
    const passwordInput = document.getElementById('password');
    const authError = document.getElementById('auth-error');

    async function hashPassword(password) {
      const data = new TextEncoder().encode(password);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash), (byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    authForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      authError.textContent = '';
      const isValid = (await hashPassword(passwordInput.value)) === passwordHash;
      if (!isValid) {
        authError.textContent = 'Incorrect password.';
        passwordInput.value = '';
        passwordInput.focus();
        return;
      }
      auth.classList.add('is-hidden');
      loadCounts();
    });

    const apiBase = 'https://api.counterapi.dev/v2/morleyae';
    const counters = [
      { name: 'payhip', label: 'Editing Presets', platform: 'Payhip', icon: 'P' },
      { name: 'scenepacks', label: 'Scenepacks', platform: 'Payhip', icon: 'P' },
      { name: 'dc-server', label: 'Discord Server', platform: 'EndlessAudios', icon: 'D' },
      { name: 'morleyae-tt', label: 'morley.ae', platform: 'TikTok', icon: 'T' },
      { name: 'endlessaudios-tt', label: 'EndlessAudios', platform: 'TikTok', icon: 'T' },
      { name: 'instagram-morleyae', label: 'morley.ae', platform: 'Instagram', icon: 'I' }
    ];

    const countsElement = document.getElementById('counts');
    const updatedElement = document.getElementById('updated');
    const refreshButton = document.getElementById('refresh');

    function renderCards() {
      countsElement.innerHTML = counters.map((counter) => `
        <article class="count-card is-loading" data-name="${counter.name}">
          <div class="count-label">
            <span class="count-icon" aria-hidden="true">${counter.icon}</span>
            <div>
              <div class="count-name">${counter.label}</div>
              <div class="count-platform">${counter.platform}</div>
            </div>
          </div>
          <div class="count-value">...</div>
        </article>
      `).join('');
    }

    async function loadCounts() {
      refreshButton.disabled = true;
      updatedElement.textContent = 'Refreshing ...';

      await Promise.all(counters.map(async (counter) => {
        const card = document.querySelector(`[data-name="${counter.name}"]`);
        const value = card.querySelector('.count-value');
        try {
          const response = await fetch(`${apiBase}/${encodeURIComponent(counter.name)}?t=${Date.now()}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const result = await response.json();
          value.textContent = Number(result.data.up_count || 0).toLocaleString('en-US');
          value.classList.remove('is-updated');
          void value.offsetWidth;
          value.classList.add('is-updated');
        } catch (error) {
          value.innerHTML = '<span class="count-error">Error</span>';
          console.error(`Could not load counter ${counter.name}:`, error);
        } finally {
          card.classList.remove('is-loading');
        }
      }));

      updatedElement.textContent = `Last updated: ${new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit' }).format(new Date())}`;
      refreshButton.disabled = false;
    }

    renderCards();
    refreshButton.addEventListener('click', loadCounts);
    window.setInterval(loadCounts, 30000);
  </script>
</body>
</html>
