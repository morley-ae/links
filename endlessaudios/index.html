<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EndlessAudios™</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
    }

    body {
      overflow: hidden;
      background: #080a16;
    }
  </style>
</head>
<body>
  <iframe id="endlessAudiosPage" src="../index.html" title="EndlessAudios™"></iframe>

  <script>
    const pageFrame = document.getElementById('endlessAudiosPage');

    pageFrame.addEventListener('load', () => {
      const page = pageFrame.contentDocument;
      if (!page) return;

      page.title = 'EndlessAudios™';

      const profileImage = page.querySelector('.profile-avatar img');
      const profileName = page.querySelector('.profile-name');
      const discordSection = page.querySelector('#discord-link')?.closest('.link-section');
      const screenContent = page.querySelector('.screen-content');

      if (profileImage) {
        profileImage.src = 'assets/logo.png';
        profileImage.alt = 'EndlessAudios Logo';
      }

      if (profileName) profileName.textContent = 'EndlessAudios™';

      if (screenContent) {
        const pageSwitch = page.createElement('a');
        pageSwitch.className = 'page-switch';
        pageSwitch.href = '/';
        pageSwitch.target = '_top';
        pageSwitch.textContent = 'morley.ae';
        pageSwitch.style.setProperty('--link-delay', '1.2s');
        pageSwitch.setAttribute('aria-label', 'Morley AE öffnen');
        screenContent.appendChild(pageSwitch);
      }

      if (discordSection && screenContent) {
        const profileHeader = screenContent.querySelector('.profile-header');
        screenContent.insertBefore(discordSection, profileHeader?.nextSibling || screenContent.firstChild);
      }
    });
  </script>
</body>
</html>
