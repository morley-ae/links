<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morley AE</title>
  <link rel="icon" type="image/png" href="assets/pfp.png">
  <style>
    @property --float-y {
      syntax: "<length>";
      inherits: false;
      initial-value: 0px;
    }

    @property --float-z {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    :root {
      --ink: #f5f7ff;
      --muted: #9da5c4;
      --violet: #8b5cf6;
      --cyan: #57e6ff;
      --night: #080a16;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--night);
      font-family: "Avenir Next", Avenir, "Helvetica Neue", sans-serif;
    }

    .scene {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 44%, rgba(74, 54, 146, .23), transparent 29%),
        radial-gradient(circle at 17% 18%, rgba(32, 160, 209, .12), transparent 23%),
        radial-gradient(circle at 85% 80%, rgba(119, 55, 199, .12), transparent 25%),
        #080a16;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .3;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse at center, black, transparent 72%);
    }

    #particles { position: absolute; inset: 0; z-index: -1; }

    .intro {
      position: absolute;
      top: clamp(28px, 7vh, 76px);
      left: 50%;
      width: min(90vw, 430px);
      transform: translateX(-50%);
      text-align: center;
      animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .23em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 25px;
      height: 1px;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    h1 {
      margin: 13px 0 7px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 5vw, 43px);
      font-weight: 400;
      letter-spacing: -.045em;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .015em;
    }

    .phone-wrap {
      position: relative;
      width: min(90vw, 380px);
      aspect-ratio: .49;
      margin-top: 0;
      transform-style: preserve-3d;
      perspective: 900px;
      will-change: transform, opacity;
      animation: phone-in 1.8s .12s cubic-bezier(.16, 1, .3, 1) both;
      cursor: pointer;
    }

    .phone-wrap::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: -9%;
      height: 15%;
      border-radius: 50%;
      background: #5a38cf;
      filter: blur(30px);
      opacity: .42;
      z-index: -1;
    }

    .phone {
      position: absolute;
      inset: 0;
      padding: 9px;
      border: 1px solid rgba(255,255,255,.52);
      border-radius: 47px;
      background: linear-gradient(136deg, #d8dce5 0%, #535967 21%, #121521 48%, #737989 79%, #dfe3ed 100%);
      box-shadow: -12px 20px 55px rgba(0,0,0,.65), 0 0 38px rgba(87,230,255,.17), inset 1px 1px 1px rgba(255,255,255,.8);
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --float-y: 0px;
      --float-z: 0deg;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transform: translateY(var(--float-y)) rotateZ(var(--float-z)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      animation: phone-float 5s 1.57s ease-in-out infinite;
      scale: 1;
      transition: filter .35s ease, box-shadow .35s ease, scale .35s ease;
    }

    .phone.phone-pulse {
      filter: brightness(1.1) saturate(1.06);
    }

    .phone.phone-pulse .screen {
      animation: screen-pulse .55s ease-out;
    }

    .click-ripple {
      position: fixed;
      z-index: 2;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      pointer-events: none;
      border: 1px solid rgba(87,230,255,.55);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(87,230,255,.3), inset 0 0 8px rgba(167,123,255,.25);
      animation: click-ripple 1s ease-out forwards;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      border-radius: 39px;
      background:
        radial-gradient(circle at 65% 33%, rgba(91, 224, 255, .18), transparent 31%),
        radial-gradient(circle at 33% 75%, rgba(154, 74, 255, .2), transparent 32%),
        linear-gradient(155deg, #121b38, #080b1a 65%, #17102d);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), inset 0 0 28px rgba(0,0,0,.6);
      transition: box-shadow .35s ease, background .35s ease;
    }

    @media (hover: hover) {
      .phone-wrap:hover .phone {
        filter: brightness(1.08) saturate(1.12);
        scale: 1.035;
        box-shadow: -12px 20px 55px rgba(0,0,0,.65), 0 0 58px rgba(87,230,255,.34), inset 1px 1px 1px rgba(255,255,255,.8);
      }

      .phone-wrap:hover::after {
        opacity: .65;
        transform: scale(1.08);
        transition: opacity .35s ease, transform .35s ease;
      }

      .phone-wrap:hover .screen {
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), inset 0 0 28px rgba(0,0,0,.6), 0 0 22px rgba(87,230,255,.16);
      }
    }

    .screen::before {
      display: none;
    }

    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      width: 91px;
      height: 27px;
      transform: translateX(-50%);
      border-radius: 20px;
      background: #020307;
      box-shadow: inset 0 0 3px rgba(255,255,255,.17);
      z-index: 3;
    }

    .status {
      position: absolute;
      top: 18px;
      left: 27px;
      right: 27px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      z-index: 2;
    }

    .status-right { display: flex; gap: 6px; align-items: center; }
    .signal, .wifi { width: 12px; height: 8px; border-bottom: 2px solid currentColor; opacity: .9; }
    .wifi { border-radius: 50%; border-top: 2px solid currentColor; }
    .battery { width: 16px; height: 8px; border: 1px solid currentColor; border-radius: 2px; position: relative; }
    .battery::after { content: ""; position: absolute; inset: 1px 3px 1px 1px; border-radius: 1px; background: currentColor; }

    .screen-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      overflow-y: auto;
      padding: 48px 15px 22px;
      text-align: center;
      scrollbar-width: none;
    }

    .screen-content::-webkit-scrollbar { display: none; }

    .screen-actions {
      position: absolute;
      top: 48px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      z-index: 2;
    }

    .action-button {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      color: rgba(255,255,255,.9);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      font: 700 13px/1 "Avenir Next", Avenir, sans-serif;
    }

    .profile-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .profile-avatar {
      display: grid;
      width: 92px;
      height: 92px;
      place-items: center;
      margin-bottom: 2px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.5);
      border-radius: 50%;
      background: #111522;
      box-shadow: 0 5px 18px rgba(0,0,0,.35), 0 0 18px rgba(87,230,255,.2);
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      color: #fff;
      font: italic 700 20px/1.1 "Avenir Next", Avenir, sans-serif;
    }

    .link-section {
      position: relative;
      width: 100%;
    }

    .section-title {
      margin: 8px 0 7px;
      color: rgba(255,255,255,.88);
      font: 700 14px/1 "Avenir Next", Avenir, sans-serif;
      opacity: 0;
      animation: link-button-in .65s var(--link-delay, 0s) cubic-bezier(.08,.82,.22,1) forwards;
    }

    .orb {
      position: absolute;
      top: 34%;
      width: 105px;
      height: 105px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0 2%, #78eaff 9%, #8159ff 42%, transparent 70%);
      filter: blur(1px);
      opacity: .9;
      box-shadow: 0 0 52px rgba(107, 174, 255, .42);
      animation: float 4s ease-in-out infinite;
    }

    .link-list {
      position: relative;
      display: grid;
      width: 100%;
      gap: 6px;
      transform-style: preserve-3d;
    }

    .link-button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 50px;
      padding: 7px 11px 7px 9px;
      color: rgba(255,255,255,.94);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255,255,255,.24), rgba(255,255,255,.08));
      box-shadow: inset 0 1px 1px rgba(255,255,255,.35), inset 0 -1px 1px rgba(0,0,0,.12), 0 7px 18px rgba(0,0,0,.25);
      -webkit-backdrop-filter: blur(14px) saturate(145%);
      backdrop-filter: blur(14px) saturate(145%);
      font: 700 13px "Avenir Next", Avenir, sans-serif;
      text-decoration: none;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transition: transform .25s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
      opacity: 0;
      animation: link-button-in .85s var(--link-delay, 0s) cubic-bezier(.22,.7,.2,1) forwards;
    }

    .link-button span:nth-child(2) {
      position: absolute;
      left: 50%;
      width: calc(100% - 92px);
      transform: translateX(-50%);
      text-align: center;
    }

    .link-icon {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      overflow: hidden;
      margin-right: 10px;
      border-radius: 50%;
      background: linear-gradient(145deg, #9ceeff, #6856dc);
      color: #fff;
      font: 800 11px/1 "Avenir Next", Avenir, sans-serif;
    }

    .link-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .link-more {
      color: rgba(255,255,255,.7);
      font-size: 17px;
      line-height: .5;
      letter-spacing: 1px;
    }

    .link-button:hover { transform: translateY(-2px); background: linear-gradient(135deg, rgba(255,255,255,.38), rgba(255,255,255,.14)); border-color: rgba(255,255,255,.52); box-shadow: inset 0 1px 1px rgba(255,255,255,.5), 0 10px 24px rgba(0,0,0,.35), 0 0 18px rgba(87,230,255,.3); }
    .link-button:active { transform: translateY(1px) scale(.97); background: rgba(255,255,255,.2); box-shadow: inset 0 2px 4px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.2); }
    .link-button:focus-visible, .copy-invite:focus-visible, .discord-back:focus-visible { outline: 2px solid rgba(130,235,255,.9); outline-offset: 3px; }

    .page-switch {
      display: grid;
      width: 42px;
      height: 42px;
      margin-top: 18px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      box-shadow: 0 6px 18px rgba(0,0,0,.25), 0 0 12px rgba(87,230,255,.12);
      opacity: .82;
      transition: transform .25s ease, opacity .25s ease, box-shadow .25s ease;
    }

    .page-switch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .page-switch:hover,
    .page-switch:focus-visible {
      opacity: 1;
      transform: translateY(-3px) scale(1.1);
      box-shadow: 0 10px 24px rgba(0,0,0,.35), 0 0 22px rgba(87,230,255,.42);
    }

    .page-switch:focus-visible { outline: 2px solid rgba(130,235,255,.9); outline-offset: 3px; }

    .discord-view {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 72px 24px 38px;
      overflow-y: auto;
      background: linear-gradient(145deg, rgba(18,27,56,.94), rgba(8,11,26,.97));
      text-align: center;
      scrollbar-width: none;
    }

    .discord-view::-webkit-scrollbar { display: none; }
    .discord-view.is-visible { display: flex; animation: discord-in .35s ease both; }

    .discord-back {
      position: absolute;
      top: 48px;
      left: 17px;
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      color: rgba(255,255,255,.9);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      cursor: pointer;
      font: 700 16px/1 "Avenir Next", Avenir, sans-serif;
    }

    .discord-logo {
      width: 116px;
      height: 116px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,.45);
      border-radius: 50%;
      box-shadow: 0 0 28px rgba(87,230,255,.24), 0 12px 30px rgba(0,0,0,.3);
    }

    .discord-view h2 {
      margin: 0;
      color: #fff;
      font: 700 22px/1.1 "Avenir Next", Avenir, sans-serif;
    }

    .discord-copy {
      max-width: 230px;
      margin: 0;
      color: rgba(255,255,255,.78);
      font: 600 12px/1.45 "Avenir Next", Avenir, sans-serif;
    }

    .invite-link {
      width: 100%;
      padding: 12px 13px;
      color: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      font: 600 11px/1.3 "Avenir Next", Avenir, sans-serif;
      user-select: all;
    }

    .copy-invite {
      width: 100%;
      min-height: 47px;
      color: #fff;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 13px;
      background: linear-gradient(135deg, rgba(255,255,255,.26), rgba(255,255,255,.1));
      box-shadow: inset 0 1px 1px rgba(255,255,255,.35), 0 8px 20px rgba(0,0,0,.22);
      cursor: pointer;
      font: 700 13px "Avenir Next", Avenir, sans-serif;
      transition: background .25s ease, transform .25s ease;
    }

    .copy-invite:hover { background: linear-gradient(135deg, rgba(255,255,255,.36), rgba(255,255,255,.15)); transform: translateY(-2px); }
    .copy-invite.is-copied { background: rgba(45,214,154,.35); }

    .home-indicator {
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 93px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 5px;
      background: rgba(255,255,255,.85);
    }

    .side-button { position: absolute; background: #888f9f; border-radius: 2px 0 0 2px; left: -3px; box-shadow: inset 0 1px rgba(255,255,255,.4); }
    .side-button.one { top: 98px; width: 3px; height: 32px; }
    .side-button.two { top: 143px; width: 3px; height: 55px; }
    .side-button.three { top: 208px; width: 3px; height: 55px; }
    .power { position: absolute; right: -3px; top: 156px; width: 3px; height: 83px; border-radius: 0 2px 2px 0; background: #858c9c; }

    .corner-note { position: absolute; bottom: 26px; color: rgba(157,165,196,.55); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }

    @keyframes rise { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes phone-in {
      from { opacity: 0; transform: translateY(52vh) rotateY(180deg) scale(.82); }
      38% { opacity: 1; }
      to { opacity: 1; transform: translateY(0) rotateY(0deg) scale(1); }
    }
    @keyframes phone-float {
      0%, 100% { --float-y: 0px; --float-z: 0deg; }
      50% { --float-y: -14px; --float-z: .9deg; }
    }
    @keyframes screen-pulse {
      0%, 100% { box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), inset 0 0 28px rgba(0,0,0,.6); }
      45% { box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), inset 0 0 34px rgba(87,230,255,.2), 0 0 18px rgba(87,230,255,.22); }
    }
    @keyframes click-ripple {
      from { opacity: .9; transform: scale(.4); }
      to { opacity: 0; transform: scale(8); }
    }
    @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-13px) scale(1.04); } }
    @keyframes link-button-in {
      from { opacity: 0; transform: translateY(14px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes discord-in { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: scale(1); } }

    @media (max-height: 700px) {
      .phone-wrap { width: min(78vw, 315px); }
      .corner-note { bottom: 12px; }
    }

    @media (max-width: 420px) {
      .phone-wrap { width: min(92vw, 350px); }
      .screen-content { padding-inline: 12px; }
      .link-button { min-height: 50px; }
      .profile-avatar { width: 84px; height: 84px; }
    }

    @media (max-width: 380px) {
      .phone-wrap { width: 73vw; }
      .screen-content { padding-inline: 23px; }
      .link-button { min-height: 48px; font-size: 12px; }
      .link-icon { width: 33px; height: 33px; flex-basis: 33px; }
    }
  </style>
</head>
<body>

    <canvas id="particles" aria-hidden="true"></canvas>

            <section class="link-section">
              <h3 class="section-title">TikTok</h3>
              <div class="link-list">

                  <span class="link-icon"><img src="assets/tiktok_logo.avif" alt=""></span><span>morley.ae</span><span class="link-more">⋮</span>

                  <span class="link-icon"><img src="assets/tiktok_logo.avif" alt=""></span><span>EndlessAudios™</span><span class="link-more">⋮</span>
                </a>
              </div>
            </section>

            <section class="link-section">
              <h3 class="section-title">Instagram</h3>
              <div class="link-list">
                <a class="link-button" href="https://instagram.com/morley.ae" data-counter="instagram-morleyae" target="_blank" rel="noopener noreferrer">
                  <span class="link-icon"><img src="assets/instagram_logo.webp" alt=""></span><span>morley.ae</span><span class="link-more">⋮</span>
                </a>
              </div>

              <img src="assets/logo.png" alt="EndlessAudios Logo">

            <button class="discord-back" type="button" id="discord-back" aria-label="Zurück">‹</button>
            <img class="discord-logo" src="assets/logo.png" alt="EndlessAudios Logo">

            <p class="discord-copy">Copy the link and paste it into your browser!</p>
            <div class="invite-link">https://discord.gg/ehVMQtUacr</div>
            <button class="copy-invite" type="button" id="copy-invite">Copy Link</button>
          </section>
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>
    <div class="corner-note">© 2026 morley.ae</div>
  </main>

  <script>
    const counterApiBase = 'https://api.counterapi.dev/v2/morleyae';

    function trackCounter(counterName) {
      const cacheBuster = `?t=${Date.now()}`;
      fetch(`${counterApiBase}/${encodeURIComponent(counterName)}/up${cacheBuster}`, {
        method: 'GET',
        keepalive: true,
        mode: 'cors'
      }).catch((error) => {
        console.error('CounterAPI tracking failed:', error);
      });
    }

    document.querySelectorAll('[data-counter]').forEach((link) => {
      link.addEventListener('click', () => {
        trackCounter(link.dataset.counter);
      });
    });

    const canvas = document.getElementById('particles');
    const context = canvas.getContext('2d');
    const particles = [];
    const pointer = { x: null, y: null };
    const particleCount = 105;

    function resize() {
      const density = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * density;
      canvas.height = window.innerHeight * density;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      context.setTransform(density, 0, 0, density, 0, 0);
    }

    function createParticle() {
      return {
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 1.7 + .35,
        speed: Math.random() * .34 + .08,
        drift: (Math.random() - .5) * .18,
        burstX: 0,
        burstY: 0,
        alpha: Math.random() * .55 + .16,
        hue: Math.random() > .5 ? 190 : 260
      };
    }

    function draw() {
      context.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const particle of particles) {
        particle.y -= particle.speed;
        particle.x += particle.drift + particle.burstX;
        particle.y += particle.burstY;
        particle.burstX *= .94;
        particle.burstY *= .94;
        if (particle.y < -10) { particle.y = window.innerHeight + 10; particle.x = Math.random() * window.innerWidth; }
        if (particle.x < -10 || particle.x > window.innerWidth + 10) particle.drift *= -1;
        const distance = pointer.x === null ? 999 : Math.hypot(particle.x - pointer.x, particle.y - pointer.y);
        const glow = distance < 120 ? (1 - distance / 120) * .8 : 0;
        context.beginPath();
        context.arc(particle.x, particle.y, particle.radius + glow, 0, Math.PI * 2);
        context.fillStyle = `hsla(${particle.hue}, 90%, 75%, ${particle.alpha + glow})`;
        context.shadowBlur = glow * 16;
        context.shadowColor = particle.hue === 190 ? '#57e6ff' : '#a77bff';
        context.fill();
      }
      context.shadowBlur = 0;
      requestAnimationFrame(draw);
    }

    resize();
    for (let index = 0; index < particleCount; index += 1) particles.push(createParticle());
    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', (event) => { pointer.x = event.clientX; pointer.y = event.clientY; });
    window.addEventListener('pointerleave', () => { pointer.x = null; pointer.y = null; });

    const discordLink = document.getElementById('discord-link');
    const discordView = document.getElementById('discord-view');
    const discordBack = document.getElementById('discord-back');
    const copyInvite = document.getElementById('copy-invite');
    const discordInvite = 'https://discord.gg/ehVMQtUacr';
    const phoneWrap = document.querySelector('.phone-wrap');
    const phone = phoneWrap.querySelector('.phone');
    const scene = document.querySelector('.scene');
    document.querySelectorAll('.section-title, .link-button').forEach((element, index) => {
      element.style.setProperty('--link-delay', `${index * 150}ms`);
    });
    const tilt = { targetX: 0, targetY: 0, currentX: 0, currentY: 0 };

    function triggerPhonePulse() {
      phone.classList.remove('phone-pulse');
      void phone.offsetWidth;
      phone.classList.add('phone-pulse');
      window.setTimeout(() => phone.classList.remove('phone-pulse'), 600);
    }

    phoneWrap.addEventListener('click', () => {
      triggerPhonePulse();
    });

    scene.addEventListener('click', (event) => {
      if (event.target.closest('.phone-wrap')) return;
      for (const particle of particles) {
        const offsetX = particle.x - event.clientX;
        const offsetY = particle.y - event.clientY;
        const distance = Math.hypot(offsetX, offsetY);
        if (distance > 220 || distance < 1) continue;
        const strength = (1 - distance / 220) * .9;
        particle.burstX += (offsetX / distance) * strength;
        particle.burstY += (offsetY / distance) * strength;
      }
      const ripple = document.createElement('span');
      ripple.className = 'click-ripple';
      ripple.style.left = `${event.clientX}px`;
      ripple.style.top = `${event.clientY}px`;
      scene.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
    });

    function updatePhoneTilt() {
      tilt.currentX += (tilt.targetX - tilt.currentX) * .08;
      tilt.currentY += (tilt.targetY - tilt.currentY) * .08;
      phone.style.setProperty('--tilt-x', `${tilt.currentX.toFixed(2)}deg`);
      phone.style.setProperty('--tilt-y', `${tilt.currentY.toFixed(2)}deg`);
      requestAnimationFrame(updatePhoneTilt);
    }

    window.addEventListener('pointermove', (event) => {
      if (!window.matchMedia('(hover: hover)').matches || !phoneWrap.matches(':hover')) return;
      const bounds = phoneWrap.getBoundingClientRect();
      const normalizedX = (event.clientX - (bounds.left + bounds.width / 2)) / (bounds.width / 2);
      const normalizedY = (event.clientY - (bounds.top + bounds.height / 2)) / (bounds.height / 2);
      tilt.targetY = Math.max(-6, Math.min(6, normalizedX * 6));
      tilt.targetX = Math.max(-5, Math.min(5, normalizedY * -5));
    });

    phoneWrap.addEventListener('pointerleave', () => {
      tilt.targetX = 0;
      tilt.targetY = 0;
    });

    window.addEventListener('pointerleave', () => {
      tilt.targetX = 0;
      tilt.targetY = 0;
    });

    discordLink.addEventListener('click', () => {
      discordView.classList.add('is-visible');
      discordView.setAttribute('aria-hidden', 'false');
    });

    discordBack.addEventListener('click', () => {
      discordView.classList.remove('is-visible');
      discordView.setAttribute('aria-hidden', 'true');
      copyInvite.textContent = 'Copy Link';
      copyInvite.classList.remove('is-copied');
    });

    copyInvite.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(discordInvite);
        copyInvite.textContent = 'Copied to Clipboard';
        copyInvite.classList.add('is-copied');
      } catch (error) {
        copyInvite.textContent = 'Copy not available';
      }
    });
    updatePhoneTilt();
    draw();
  </script>
</body>
</html>
